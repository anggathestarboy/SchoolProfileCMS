[supervisord]
nodaemon=true
user=root

[program:frankenphp]
command=frankenphp run --config /etc/caddy/Caddyfile --adapter caddyfile
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Runs the Laravel scheduler in-process (ticks every minute) so scheduled
; entries (see README "Scheduled entries") go live without needing a real
; crontab on the host — see routes/console.php.
[program:scheduler]
command=php artisan schedule:work
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Processes queued jobs (currently: password reset emails — see
; App\Models\User::sendPasswordResetNotification()) so they don't block the
; request on a slow SMTP connection. --tries=3 retries a failed send twice
; before giving up (landing in the "failed_jobs" table); autorestart=true
; means Supervisor restarts it if it ever exits (e.g. after a queue:restart
; signal, which this app doesn't currently send, but a future deploy step
; might).
[program:queue-worker]
command=php artisan queue:work --tries=3 --backoff=3
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
